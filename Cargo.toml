[package]
name = "firebus"
version = "0.1.0"
edition = "2021"

[lib]
name = "firebus"
path = "src/lib.rs"

[[bin]]
name = "firebus"
path = "src/main.rs"

[dependencies]
aes = "0.8"
bytebuffer = "2.3.0"
chrono = "0.4.38"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["sha2"] }
rand = "0.8.5"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
